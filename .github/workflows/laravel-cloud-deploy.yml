name: Deploy Laravel Project to Laravel Cloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Actions checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, mysql, zip, sqlite3

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install PHP Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ":memory:"
      run: php artisan test

  deploy-to-vps:
    needs: laravel-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Actions checkout
        uses: actions/checkout@v4

      - name: Run Master Deployment Script (deploy.sh)
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          echo "Preparing SSH Key from Secrets..."
          echo "$SERVER_KEY" > server_key.pem
          chmod 600 server_key.pem

          echo "Making deploy.sh executable..."
          chmod +x deploy.sh

          echo "Executing the deployment script..."
          bash deploy.sh
